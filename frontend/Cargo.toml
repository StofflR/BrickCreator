[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shared = { path = "../shared" }
resvg = "0.47.0"
usvg = "0.47.0"
tiny-skia = { version = "0.12.0", features = ["png-format"] }
serde_json = "1.0.149"
base64 = "0.22.1"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "EventTarget", "File", "FileList", "FileReader", "HtmlElement", "HtmlAnchorElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "HtmlImageElement", "HtmlInputElement", "HtmlTextAreaElement", "DragEvent", "DataTransfer", "Blob", "BlobPropertyBag", "Url", "ResizeObserver", "ResizeObserverEntry"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
yew = { version = "0.22.1", features = ["csr"] }
gloo = { version = "0.11", features = ["file"] }
